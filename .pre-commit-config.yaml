default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Every hook skips these but detect-secrets, which must see docs/
        # and migrations too (#28).
        exclude: &default-exclude '^docs/|/migrations/|devcontainer.json'
      - id: end-of-file-fixer
        exclude: *default-exclude
      - id: check-json
        exclude: *default-exclude
      - id: check-toml
        exclude: *default-exclude
      - id: check-xml
        exclude: *default-exclude
      - id: check-yaml
        exclude: *default-exclude
      - id: debug-statements
        exclude: *default-exclude
      - id: check-builtin-literals
        exclude: *default-exclude
      - id: check-case-conflict
        exclude: *default-exclude
      - id: check-docstring-first
        exclude: *default-exclude
      - id: detect-private-key
        exclude: *default-exclude

  # Secret scanning (#28): fails on any secret that .secrets.baseline does
  # not list. CI runs it through pre-commit on all files. No exclude: it
  # scans every file, docs/, migrations and a force-added .env included.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        exclude: *default-exclude
        args: [--severity=warning]

  - repo: https://github.com/adamchainz/django-upgrade
    rev: '1.28.0'
    hooks:
      - id: django-upgrade
        exclude: *default-exclude
        args: ['--target-version', '5.2']

  # Run the Ruff linter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Linter
      - id: ruff-check
        exclude: *default-exclude
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter
      - id: ruff-format
        exclude: *default-exclude

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.46.4
    hooks:
      - id: djlint-reformat-django
        exclude: *default-exclude
      - id: djlint-django
        exclude: *default-exclude

# sets up .pre-commit-ci.yaml to ensure pre-commit dependencies stay up to date
ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
