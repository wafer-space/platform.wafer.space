# Thousand Parsec wildcard catch-all - redirect to .net
server {
    listen 80;
    listen [::]:80;
    server_name *.thousandparsec.com *.thousandparsec.net *.thousandparsec.org;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to Wayback Machine with .net equivalent
    location / {
        set $net_host $host;
        if ($host ~ ^(.*)\.thousandparsec\.(com|org)$) {
            set $net_host $1.thousandparsec.net;
        }
        # If already .net, preserve it
        return 301 https://web.archive.org/web/20100101000000/http://$net_host$request_uri;
    }
}

# Redirect HTTP to HTTPS for platform.wafer.space
server {
    listen 80;
    listen [::]:80;
    server_name platform.wafer.space;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Thousand Parsec git subdomain - redirect to GitHub
# UNCOMMENTED BY SSL SETUP SCRIPT
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name git.thousandparsec.com git.thousandparsec.net git.thousandparsec.org;

    # Use platform.wafer.space SSL certs for Thousand Parsec domains
    ssl_certificate /etc/letsencrypt/live/platform.wafer.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.wafer.space/privkey.pem;

    # SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Redirect to GitHub organization
    location / {
        return 301 https://github.com/thousandparsec$request_uri;
    }
}
