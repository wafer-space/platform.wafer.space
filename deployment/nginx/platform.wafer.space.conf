# Default server block - catch all unknown domains
# NOTE: Remove any other default server configs in /etc/nginx/sites-enabled/
# to avoid "duplicate default server" errors
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Return 444 (connection closed without response) for unknown domains
    return 444;
}

# Thousand Parsec git subdomain - redirect to GitHub
server {
    listen 80;
    listen [::]:80;
    server_name git.thousandparsec.com git.thousandparsec.net git.thousandparsec.org;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to GitHub organization
    location / {
        return 301 https://github.com/thousandparsec$request_uri;
    }
}

# Thousand Parsec forums.thousandparsec.com - HAS unique archived content
# Redirect to forums.thousandparsec.com (not .net) to preserve unique archive
server {
    listen 80;
    listen [::]:80;
    server_name forums.thousandparsec.com;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to Wayback Machine with forums.thousandparsec.com
    location / {
        return 301 https://web.archive.org/web/20100101000000/http://forums.thousandparsec.com$request_uri;
    }
}

# Thousand Parsec .net domains - redirect to themselves (primary archived domain)
server {
    listen 80;
    listen [::]:80;
    server_name thousandparsec.net www.thousandparsec.net
                code.thousandparsec.net
                darcs.thousandparsec.net
                forums.thousandparsec.net
                mail.thousandparsec.net
                metaserver.thousandparsec.net
                old.thousandparsec.net
                packages.thousandparsec.net
                schemepy.thousandparsec.net
                svn.thousandparsec.net
                test.thousandparsec.net;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to Wayback Machine preserving .net hostname (best archive coverage)
    location / {
        return 301 https://web.archive.org/web/20100101000000/http://$host$request_uri;
    }
}

# Thousand Parsec .com domains (except forums) - redirect to .net equivalent
server {
    listen 80;
    listen [::]:80;
    server_name thousandparsec.com www.thousandparsec.com
                code.thousandparsec.com
                darcs.thousandparsec.com
                mail.thousandparsec.com
                metaserver.thousandparsec.com
                old.thousandparsec.com
                packages.thousandparsec.com
                schemepy.thousandparsec.com
                svn.thousandparsec.com
                test.thousandparsec.com;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to Wayback Machine with .net equivalent (better archive coverage)
    location / {
        # Extract subdomain and redirect to .net
        # thousandparsec.com -> thousandparsec.net
        # www.thousandparsec.com -> www.thousandparsec.net
        # code.thousandparsec.com -> code.thousandparsec.net
        set $net_host $host;
        if ($host ~ ^(.*)\.thousandparsec\.com$) {
            set $net_host $1.thousandparsec.net;
        }
        if ($host = "thousandparsec.com") {
            set $net_host thousandparsec.net;
        }
        return 301 https://web.archive.org/web/20100101000000/http://$net_host$request_uri;
    }
}

