# Default server block - catch all unknown domains
# NOTE: Remove any other default server configs in /etc/nginx/sites-enabled/
# to avoid "duplicate default server" errors
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Return 444 (connection closed without response) for unknown domains
    return 444;
}

# Thousand Parsec git subdomain - redirect to GitHub
server {
    listen 80;
    listen [::]:80;
    server_name git.thousandparsec.com git.thousandparsec.net git.thousandparsec.org;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to GitHub organization
    location / {
        return 301 https://github.com/thousandparsec$request_uri;
    }
}

# Thousand Parsec mail subdomain - redirect to Wayback Machine
server {
    listen 80;
    listen [::]:80;
    server_name mail.thousandparsec.com mail.thousandparsec.net mail.thousandparsec.org;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to Wayback Machine snapshot
    location / {
        return 301 https://web.archive.org/web/20100101000000/http://thousandparsec.net$request_uri;
    }
}

# Thousand Parsec old subdomain - redirect to Wayback Machine
server {
    listen 80;
    listen [::]:80;
    server_name old.thousandparsec.com old.thousandparsec.net old.thousandparsec.org;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to Wayback Machine snapshot
    location / {
        return 301 https://web.archive.org/web/20100101000000/http://thousandparsec.net$request_uri;
    }
}

# Thousand Parsec main domains and historical subdomains - redirect to Wayback Machine
server {
    listen 80;
    listen [::]:80;
    server_name thousandparsec.com www.thousandparsec.com
                thousandparsec.net www.thousandparsec.net
                thousandparsec.org www.thousandparsec.org
                code.thousandparsec.com code.thousandparsec.net code.thousandparsec.org
                darcs.thousandparsec.com darcs.thousandparsec.net darcs.thousandparsec.org
                forums.thousandparsec.com forums.thousandparsec.net forums.thousandparsec.org
                metaserver.thousandparsec.com metaserver.thousandparsec.net metaserver.thousandparsec.org
                packages.thousandparsec.com packages.thousandparsec.net packages.thousandparsec.org
                schemepy.thousandparsec.com schemepy.thousandparsec.net schemepy.thousandparsec.org
                svn.thousandparsec.com svn.thousandparsec.net svn.thousandparsec.org
                test.thousandparsec.com test.thousandparsec.net test.thousandparsec.org;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to Wayback Machine snapshot of original website
    location / {
        return 301 https://web.archive.org/web/20100101000000/http://thousandparsec.net$request_uri;
    }
}

# Thousand Parsec wildcard catch-all - redirect to Wayback Machine
server {
    listen 80;
    listen [::]:80;
    server_name *.thousandparsec.com *.thousandparsec.net *.thousandparsec.org;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to Wayback Machine snapshot of original website
    location / {
        return 301 https://web.archive.org/web/20100101000000/http://thousandparsec.net$request_uri;
    }
}

# Redirect HTTP to HTTPS for platform.wafer.space
server {
    listen 80;
    listen [::]:80;
    server_name platform.wafer.space;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

