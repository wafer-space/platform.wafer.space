# Default server block - catch all unknown domains
# NOTE: Remove any other default server configs in /etc/nginx/sites-enabled/
# to avoid "duplicate default server" errors
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Return 444 (connection closed without response) for unknown domains
    return 444;
}

# Redirect HTTP to HTTPS for platform.wafer.space
server {
    listen 80;
    listen [::]:80;
    server_name platform.wafer.space;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server - platform.wafer.space
# This block is initially commented out and will be uncommented by the SSL setup script
# HTTPS Server - UNCOMMENTED BY SSL SETUP SCRIPT
#
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name platform.wafer.space;

    # SSL certificates (will be configured by certbot)
    ssl_certificate /etc/letsencrypt/live/platform.wafer.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.wafer.space/privkey.pem;

    # SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    # HSTS: 1 year for production (matches SECURE_HSTS_SECONDS = 31536000 in prod.py)
    # Preload directive included (matches SECURE_HSTS_PRELOAD = True in prod.py)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size (for file uploads)
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/platform.wafer.space-access.log;
    error_log /var/log/nginx/platform.wafer.space-error.log;

    # Static files (served by WhiteNoise through Django)
    # WhiteNoise will handle static files, so we don't need a separate location

    # Media files (user uploads)
    location /media/ {
        alias /home/django/platform.wafer.space/wafer_space/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://unix:/run/platform.wafer.space/gunicorn.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (optional)
    location /health/ {
        proxy_pass http://unix:/run/platform.wafer.space/gunicorn.sock;
        access_log off;
    }
}
