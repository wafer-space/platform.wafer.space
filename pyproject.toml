# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib -m 'not manual'"
markers = [
    "manual: marks tests as manual/visual tests requiring visible browser (deselect by default)",
    "browser: marks tests as browser tests (included by default, always headless)",
]
python_files = [
    "tests.py",
    "test_*.py",
]
# Note: Display environment is cleared at tests/browser/conftest.py import time
# Browser tests are always headless by default. Use --visible for manual debugging.

# ==== Coverage ====
[tool.coverage.run]
include = ["wafer_space/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H021,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    'ISC',
    "ICN",
    "G",
    'INP',
    'PIE',
    "T20",
    'PYI',
    'PT',
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "INT",
    # "ARG", # Unused function argument
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    # "NPY",
    # "AIR",
    "PERF",
    # "FURB",
    # "LOG",
    "RUF",
]
ignore = [
    "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102", # sometimes it's better to nest
    "COM812", # Trailing comma missing - conflicts with formatter
    # of types for comparison.
    # Deactivated because it can make the code slow:
    # https://github.com/astral-sh/ruff/issues/7871
]

[tool.ruff.lint.isort]
force-single-line = true

[dependency-groups]
dev = [
    "coverage==7.10.7",
    "django-coverage-plugin==3.1.1",
    "django-debug-toolbar==6.0.0",
    "django-extensions==4.1",
    "django-stubs[compatible-mypy]==5.2.5",
    "djlint==1.36.4",
    "factory-boy==3.3.2",
    "honcho>=2.0.0",
    "ipdb==0.13.13",
    "mypy==1.18.2",
    "pre-commit==4.3.0",
    "psycopg[binary]==3.2.10",
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "pytest-selenium==4.1.0",
    "pytest-sugar==1.1.1",
    "pytest-xdist==3.6.1",
    "ruff==0.13.1",
    "selenium==4.27.1",
    "sphinx==8.2.3",
    "sphinx-autobuild==2025.8.25",
    "webdriver-manager==4.0.2",
    "werkzeug[watchdog]==3.1.3",
]

[project]
name = "wafer_space"
version = "0.0.1"
description = "Platform for wafer.space low cost silicon manufacturing."
readme = "README.md"

license = { text = "Apache Software License 2.0" }
authors = [
  { name = "Tim 'mithro' Ansell", email = "tim@wafer.space" },
]
requires-python = "==3.13.*"
dependencies = [
    "argon2-cffi==25.1.0",
    "crispy-bootstrap5==2025.6",
    "django==5.2.6",
    "django-allauth[mfa,socialaccount]==65.11.2",
    "django-anymail[mailgun]==13.1",
    "django-crispy-forms==2.4",
    "django-environ==0.12.0",
    "django-model-utils==5.0.0",
    "gunicorn==23.0.0",
    "celery>=5.3.0",
    "kombu[sqlalchemy]>=5.3.0",  # SQLAlchemy transport for Celery broker
    "django-celery-results>=2.5.0",
    "django-webpush>=0.3.0",  # Web Push notifications
    "markdown==3.6",  # For rendering markdown TOS files
    "python-frontmatter==1.1.0",  # For parsing markdown front matter
    "sqlalchemy>=2.0.0",  # Required for SQLAlchemy broker
    "pillow==11.3.0",
    "psycopg[c]==3.2.10",
    "psycopg2-binary>=2.9.0",  # Required by SQLAlchemy for Celery broker
    "python-slugify==8.0.4",
    "whitenoise==6.11.0",
]
