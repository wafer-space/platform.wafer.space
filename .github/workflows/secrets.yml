name: Secret scan

# Fails when a file holds a secret that .secrets.baseline does not list (#28).
# A workflow of its own because ci.yml ignores docs-only changes, and a
# secret pasted into docs/ must fail too. The linter job in ci.yml runs the
# same hook as part of pre-commit.
on:
  pull_request:
    branches: ['main']

  push:
    branches: ['main']

  workflow_dispatch:

concurrency:
  group: secrets-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Scan every file for secrets
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: detect-secrets --all-files
